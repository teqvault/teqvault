<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ten Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ten-words.css">
</head>
<body>

<h1>TEN WORDS</h1>
<div class="sub">Ten words, one story · place them all · six tries</div>

<div class="tabs">
  <div class="tab active" id="tabDaily">DAILY</div>
  <div class="tab" id="tabPractice">PRACTICE</div>
</div>

<div class="hud">
  <span id="hudLeft">Day #1</span>
  <span class="streak" id="hudStreak"></span>
</div>

<div class="card">
  <div class="storyTitle" id="storyTitle"></div>
  <div class="sentence" id="sentence"></div>
  <div class="bankrow" id="bank"></div>
</div>

<div class="controls">
  <button class="act" id="clearBtn">CLEAR</button>
  <button class="act primary" id="submitBtn" disabled>SUBMIT</button>
</div>

<div class="history" id="history"></div>

<div class="hint" id="hint">Tap a word, then tap a blank to place it. Tap a filled blank to pick it back up.</div>

<div class="veil" id="resultVeil">
  <div class="paper">
    <div class="kick" id="rKick"></div>
    <div class="result" id="rResult"></div>
    <div class="body" id="rBody"></div>
    <div class="rowbtns">
      <button id="shareBtn">COPY RESULT</button>
      <button class="secondary" id="closeBtn">CLOSE</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="ten-words.js"></script>
</body>
</html>
